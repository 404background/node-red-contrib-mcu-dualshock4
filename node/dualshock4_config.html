<script type="text/javascript">
    RED.nodes.registerType("dualshock4_config", {
        category: "config",
        paletteLabel: "dualshock4 config",
        defaults: {
            name: { value: "" },
            ds4mac: { value: "", validate: function (v) {
                return !v || /^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$/.test(v);
            }},
            interval: { value: 100, required: true, validate: RED.validators.number() }
        },
        label: function () {
            return this.name || this.ds4mac || "DualShock4";
        }
    });
</script>

<script type="text/html" data-template-name="dualshock4_config">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> <span data-i18n="dualshock4_config.label.name"></span></label>
        <input type="text" id="node-config-input-name" placeholder="DualShock4">
    </div>
    <div class="form-row">
        <label for="node-config-input-ds4mac"><i class="fa fa-bluetooth-b"></i> <span data-i18n="dualshock4_config.label.ds4mac"></span></label>
        <input type="text" id="node-config-input-ds4mac" data-i18n="[placeholder]dualshock4_config.placeholder.ds4mac">
    </div>
    <div class="form-row">
        <label for="node-config-input-interval"><i class="fa fa-clock-o"></i> <span data-i18n="dualshock4_config.label.interval"></span></label>
        <input type="number" id="node-config-input-interval" min="10" style="width: 100px;"> ms
    </div>
    <div class="form-tips" data-i18n="[html]dualshock4_config.tip"></div>
</script>
