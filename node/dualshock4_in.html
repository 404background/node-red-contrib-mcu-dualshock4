<script type="text/javascript">
    (function () {
        const INPUTS = {
            buttons: ["cross", "circle", "square", "triangle", "l1", "r1", "l2", "r2", "share",
                      "options", "l3", "r3", "ps", "touchpad", "up", "down", "left", "right"],
            analog: ["lx", "ly", "rx", "ry", "l2_value", "r2_value"]
        };

        RED.nodes.registerType("dualshock4_in", {
            category: "MCU",
            color: "#4d4ddd",
            defaults: {
                name: { value: "" },
                controller: { value: "", type: "dualshock4_config", required: true },
                selectedInputs: { value: {} }
            },
            inputs: 0,
            outputs: 1,
            icon: "font-awesome/fa-gamepad",
            label: function () {
                return this.name || "dualshock4 in";
            },
            labelStyle: function () {
                return this.name ? "node_label_italic" : "";
            },
            oneditprepare: function () {
                const node = this;
                const saved = this.selectedInputs || {};
                const all = Object.keys(saved).length === 0;
                const container = $("#node-input-inputs-container").empty();
                const checkbox = '<input type="checkbox" style="width: auto; margin: 0 4px 0 0;">';

                const selectAll = $(checkbox);
                $('<label style="width: auto;"></label>')
                    .append(selectAll, node._("dualshock4_in.label.selectAll"))
                    .appendTo(container);

                Object.keys(INPUTS).forEach(function (group) {
                    $('<div style="margin-top: 6px; font-weight: bold;"></div>')
                        .text(node._("dualshock4_in.label." + group))
                        .appendTo(container);
                    const grid = $('<div style="display: grid; grid-template-columns: repeat(3, 1fr);"></div>')
                        .appendTo(container);
                    INPUTS[group].forEach(function (key) {
                        const item = $(checkbox).addClass("node-input-item").val(key)
                            .prop("checked", all || saved[key] === true);
                        $('<label style="width: auto; white-space: nowrap;"></label>')
                            .append(item, key)
                            .appendTo(grid);
                    });
                });

                const items = container.find(".node-input-item");
                function sync() {
                    selectAll.prop("checked", items.filter(":checked").length === items.length);
                }
                selectAll.on("change", function () {
                    items.prop("checked", selectAll.prop("checked"));
                });
                items.on("change", sync);
                sync();
            },
            oneditsave: function () {
                const selectedInputs = {};
                $("#node-input-inputs-container .node-input-item").each(function () {
                    selectedInputs[$(this).val()] = $(this).prop("checked");
                });
                this.selectedInputs = selectedInputs;
            }
        });
    })();
</script>

<script type="text/html" data-template-name="dualshock4_in">
    <div class="form-row">
        <label for="node-input-controller"><i class="fa fa-gamepad"></i> <span data-i18n="dualshock4_in.label.controller"></span></label>
        <input type="text" id="node-input-controller">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="dualshock4_in.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]dualshock4_in.label.name">
    </div>
    <div class="form-row">
        <label style="vertical-align: top;"><i class="fa fa-list"></i> <span data-i18n="dualshock4_in.label.inputs"></span></label>
        <div id="node-input-inputs-container" style="display: inline-block; width: 70%; vertical-align: top;"></div>
    </div>
</script>
