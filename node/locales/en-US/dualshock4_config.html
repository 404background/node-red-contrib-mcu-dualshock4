<script type="text/html" data-help-name="dualshock4_config">
    <p>Connection to one DualShock4 controller over Bluetooth Classic on the ESP32.
       Shared by the <code>dualshock4 in</code> and <code>dualshock4 out</code> nodes.</p>

    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>DS4 MAC</dt>
        <dd><b>Required.</b> Bluetooth address of the DualShock4 to use. Other controllers are rejected.
            The address is shown as "Device Address" in
            <a href="https://sixaxispairtool.en.lo4d.com/windows" target="_blank">SixaxisPairTool</a> (USB; not "Current Master", which is the paired host),
            or in the Bluetooth settings of a PC / smartphone while the DualShock4 is in pairing mode.</dd>
        <dt>Interval</dt>
        <dd>Polling interval of the controller state in milliseconds.</dd>
    </dl>

    <h3>Pairing</h3>
    <p>First time only: hold <b>SHARE + PS</b> on the DualShock4 until the light bar double-flashes.
       The ESP32 pairs automatically. After that, press <b>PS</b> to connect.
       The DualShock4 remembers only one host. After it was paired with a PS4, PC or another ESP32,
       hold <b>SHARE + PS</b> again to pair it with this ESP32.</p>

    <p>Only one DualShock4 connection is supported. Use a single configuration node.</p>
</script>
