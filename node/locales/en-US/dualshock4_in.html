<script type="text/html" data-help-name="dualshock4_in">
    <p>Reads a DualShock4 controller over Bluetooth Classic on the ESP32.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">unpair <span class="property-type">boolean</span></dt>
        <dd><code>true</code> deletes all pairings stored on the ESP32 and waits for pairing again.</dd>
    </dl>

    <h3>Outputs</h3>
    <p>Sent only when a selected input changes.</p>
    <dl class="message-properties">
        <dt>payload.buttons <span class="property-type">object</span></dt>
        <dd><code>cross</code>, <code>l1</code>, <code>up</code>, ... (<code>true</code> / <code>false</code>)</dd>
        <dt>payload.analog <span class="property-type">object</span></dt>
        <dd>Sticks <code>lx</code> <code>ly</code> <code>rx</code> <code>ry</code> (-128 to 127, up / right positive),
            triggers <code>l2_value</code> <code>r2_value</code> (0 to 255)</dd>
        <dt>payload.status <span class="property-type">object</span></dt>
        <dd><code>battery</code> (0 to 15), <code>charging</code></dd>
    </dl>

    <h3>Pairing</h3>
    <p>First time only: hold <b>SHARE + PS</b> on the DualShock4 until the light bar double-flashes.
       The ESP32 pairs automatically. After that, press <b>PS</b> to connect.</p>

    <h3>Details</h3>
    <dl class="message-properties">
        <dt>DS4 MAC</dt>
        <dd>Bluetooth address of the DualShock4 to use. Other controllers are rejected.
            Empty: pairs with the first DualShock4 found in pairing mode.
            The address is shown as "Device Address" in
            <a href="https://sixaxispairtool.en.lo4d.com/windows" target="_blank">SixaxisPairTool</a> (USB).</dd>
        <dt>Interval</dt>
        <dd>Polling interval in milliseconds.</dd>
        <dt>Inputs</dt>
        <dd>Buttons and sticks included in the output.</dd>
    </dl>

    <h3>Status</h3>
    <ul>
        <li><b>pairing</b> - searching for a DualShock4 in pairing mode</li>
        <li><b>waiting (press PS)</b> - paired, press PS on the DualShock4</li>
        <li><b>connected</b> - connected</li>
    </ul>
</script>
