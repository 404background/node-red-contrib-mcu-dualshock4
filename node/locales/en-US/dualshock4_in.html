<script type="text/html" data-help-name="dualshock4_in">
    <p>Receives input from the DualShock4 set in the <code>dualshock4 config</code> node.</p>

    <h3>Outputs</h3>
    <p>Sent only when a selected input changes (sticks and triggers by 2 or more).</p>
    <dl class="message-properties">
        <dt>payload.buttons <span class="property-type">object</span></dt>
        <dd><code>cross</code>, <code>l1</code>, <code>up</code>, ... (<code>true</code> / <code>false</code>)</dd>
        <dt>payload.analog <span class="property-type">object</span></dt>
        <dd>Sticks <code>lx</code> <code>ly</code> <code>rx</code> <code>ry</code> (-128 to 127, up / right positive),
            triggers <code>l2_value</code> <code>r2_value</code> (0 to 255)</dd>
        <dt>payload.status <span class="property-type">object</span></dt>
        <dd><code>battery</code> (0 to 15), <code>charging</code></dd>
    </dl>

    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Inputs</dt>
        <dd>Buttons and sticks included in the output. <code>status</code> is always included.</dd>
    </dl>

    <h3>Status</h3>
    <ul>
        <li><b>starting</b> - starting Bluetooth</li>
        <li><b>pairing</b> - searching for a DualShock4 in pairing mode (hold SHARE + PS)</li>
        <li><b>waiting (press PS)</b> - paired, press PS on the DualShock4</li>
        <li><b>connected</b> - connected</li>
    </ul>
</script>
