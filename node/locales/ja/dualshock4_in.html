<script type="text/html" data-help-name="dualshock4_in">
    <p>ESP32上でBluetooth Classic経由でDualShock4の入力を読み取ります。</p>

    <h3>入力</h3>
    <dl class="message-properties">
        <dt class="optional">unpair <span class="property-type">boolean</span></dt>
        <dd><code>true</code> を送ると、ESP32に記録されたペアリング情報を全て削除し、再ペアリングを待ちます。</dd>
    </dl>

    <h3>出力</h3>
    <p>選択した項目が変化したときだけ送信します。</p>
    <dl class="message-properties">
        <dt>payload.buttons <span class="property-type">object</span></dt>
        <dd><code>cross</code>, <code>l1</code>, <code>up</code> など（<code>true</code> / <code>false</code>）</dd>
        <dt>payload.analog <span class="property-type">object</span></dt>
        <dd>スティック <code>lx</code> <code>ly</code> <code>rx</code> <code>ry</code>（-128〜127、上・右が正）、
            トリガー <code>l2_value</code> <code>r2_value</code>（0〜255）</dd>
        <dt>payload.status <span class="property-type">object</span></dt>
        <dd><code>battery</code>（0〜15）、<code>charging</code></dd>
    </dl>

    <h3>ペアリング</h3>
    <p>初回のみ、DualShock4の <b>SHARE + PS</b> をライトバーが素早く点滅するまで長押しします。
       ESP32が自動でペアリングします。以降は <b>PS</b> ボタンを押すだけで接続されます。</p>

    <h3>詳細</h3>
    <dl class="message-properties">
        <dt>DS4 MAC</dt>
        <dd>使用するDualShock4のBluetoothアドレス。他のコントローラからの接続は拒否します。
            空欄の場合は、ペアリングモードで最初に見つかったDualShock4とペアリングします。
            アドレスは <a href="https://sixaxispairtool.en.lo4d.com/windows" target="_blank">SixaxisPairTool</a>（USB接続）の「Device Address」で確認できます。</dd>
        <dt>取得間隔</dt>
        <dd>コントローラの状態を読み取る間隔（ミリ秒）。</dd>
        <dt>出力項目</dt>
        <dd>出力に含めるボタン・スティック。</dd>
    </dl>

    <h3>ステータス</h3>
    <ul>
        <li><b>pairing</b> - ペアリングモードのDualShock4を探索中</li>
        <li><b>waiting (press PS)</b> - ペアリング済み。DualShock4のPSボタンを押してください</li>
        <li><b>connected</b> - 接続中</li>
    </ul>
</script>
